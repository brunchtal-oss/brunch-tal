[[entry]]
id = 6
type = "story"
title = "Remove personal details on request — הסרת פרטים אישיים"
description = "CAP-30: admin_anonymize_customer רגיש ודו-שלבי (ניקוי וסימון anonymization_pending, מחיקת משתמשת Auth, סגירה), שמנקה שם, טלפון, מייל, תינוקות, אלרגיות, payload של התראות, idempotency, guest_details והערות פנימיות, ומשאיר תשלומים והרשמות אנונימיים; anonymization_pending תקוע נוסף ל\"לטיפול\". טבלאות שנוצרות אחר כך (מנויי פוש ב-5.8, המתנה ב-5.6, נתוני יבוא ב-6.2) מוסיפות את עצמן לפונקציה ולבדיקה שלה. בא אחרי 4.3 כי שניהם משנים את כרטיס הלקוחה. ההסרה חסומה כל עוד יש ללקוחה הרשמה עתידית: טל רואה את ההרשמות, מבטלת אותן בעצמה (החזר או זיכוי), ורק אז מסירה."
verify = "בדיקות: אחרי ההסרה אין בשום טבלה או ביומן מידע מזהה של הלקוחה, וסכום הבית ודוח ההחזרים לא השתנו; תקלה אחרי הצעד הראשון ממשיכה ב-retry ומופיעה ב\"לטיפול\" אחרי 15 דקות. הסרה ללקוחה עם הרשמה עתידית נדחית ומציגה את ההרשמות."
covers = ["CAP-30"]
after = [3]
hitl = false
risk = "high"
references = ["ARCHITECTURE-SPINE.md#ad-19", "ARCHITECTURE-SPINE.md#ad-21"]

