title = "Phone activation and login tracer — ניסוי הפעלה והתחברות בטלפון"
description = "בסיס ל-CAP-7 ול-CAP-4: migration 0001 (ביטול הרשאות ברירת מחדל, schema private), profiles מינימלי, admin_roles, is_admin, current_customer_id ו-get_my_session_role, טבלת activation_tokens עם issue_token/find_token/token_view, reset_begin/reset_complete, מעבר service-client ל-lib/server/privileged עם server-only, lib/server/privileged/reset.ts, והמסכים /reset/[token] (עם Referrer-Policy: no-referrer, no-store ובלי משאבי צד שלישי), /login ו-/me מינימלי. סקריפט dev בלבד (service role, מחוץ ל-app) יוצר אדמין ולקוחה בדויות ב-Auth ומנפיק קישור reset; הוא מוחלף בכפתור admin_issue_link ב-2.8. המשתמשת מכבה ב-Supabase הרשמה ציבורית, Confirm email ו-Automatically expose new tables, ובודקת בטלפון שלה. אין push ל-main לפני 1.6."
verify = "בטלפון ברשת המקומית: סקריפט dev מפיק קישור ללקוחה בדויה, היא בוחרת סיסמה, מגיעה ל-/me, נשארת מחוברת אחרי סגירה ופתיחה, ופתיחה חוזרת של הקישור מציגה שהוא כבר מומש."
covers = ["E1-R4", "E1-R3", "E1-R1"]
